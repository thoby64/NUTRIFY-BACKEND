services:
  - type: web
    name: nutrition-backend
    env: python
    runtime: python-3.11
    plan: free
    buildCommand: env CARGO_HOME=/tmp/.cargo RUSTUP_HOME=/tmp/.rustup pip install --upgrade pip setuptools wheel && env CARGO_HOME=/tmp/.cargo RUSTUP_HOME=/tmp/.rustup pip install -r requirements.txt
    startCommand: python scripts/render_start.py
    envVars:
      - key: PYTHONUNBUFFERED
        value: 1
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: false
      - key: LOG_LEVEL
        value: INFO
      - key: API_HOST
        value: 0.0.0.0
      - key: SKIP_STARTUP_CHECKS
        value: false
      - key: FRONTEND_URL
        value: https://nutrition-analytic-app.onrender.com
      - key: CORS_ORIGINS
        value: '["https://nutrition-analytic-app.onrender.com"]'
      - key: DATABASE_URL
        scope: runtime
      - key: SECRET_KEY
        scope: runtime
    autoDeploy: true
